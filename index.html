<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FYNTAS AI Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* पूरा स्टाइल वैसा ही है – जगह बचाने के लिए यहाँ नहीं लिख रहा, लेकिन आपके पिछले कोड में जो स्टाइल था वह सब रखें। */
    body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; cursor: pointer; }
    .assistant-response { background: #222; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 FYNTAS AI Command Center</h1>
    <p>✨ All AI agents working together in real-time</p>
    
    <!-- 🧪 Test Button -->
    <button onclick="alert('✅ JavaScript is working!')">🧪 Test JavaScript</button>

    <!-- AI Assistant -->
    <div>
      <h2>💡 AI Assistant</h2>
      <input type="text" id="commandInput" placeholder="Type command..." style="width:100%; padding:10px;" />
      <button id="sendBtn">Send</button>
      <div class="assistant-response" id="assistantResponse">Your results will appear here...</div>
    </div>

    <button onclick="startCycle()">⚡ Start Daily Cycle</button>
    <div id="chatBox">Live Chat...</div>
    <div id="orderBody">No orders</div>
    <div id="approvalBox">No approvals</div>
  </div>

  <script>
    // ========== CONFIG ==========
    const SUPABASE_URL = "https://uipkgqqfahtdaevxwfef.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpcGtncXFmYWh0ZGFldnh3ZmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTAxNjIsImV4cCI6MjEwMTQyNjE2Mn0.i-4rx4fHHdruL8DCiwI2G2Duqfv0QO31xowPLsr4V8Y";
    const MASTER_AGENT_URL = "https://uipkgqqfahtdaevxwfef.supabase.co/functions/v1/master-agent";
    const ASSISTANT_AGENT_URL = "https://uipkgqqfahtdaevxwfef.supabase.co/functions/v1/assistant-agent";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function startCycle() {
      const res = await fetch(MASTER_AGENT_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action:"start_cycle"}) });
      alert("✅ " + (await res.json()).message);
    }

    // --- Assistant send function ---
    async function sendAssistantCommand() {
      const cmd = document.getElementById("commandInput").value.trim();
      if (!cmd) return;
      document.getElementById("assistantResponse").innerHTML = "🧠 Processing...";
      try {
        const res = await fetch(ASSISTANT_AGENT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        document.getElementById("assistantResponse").innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      } catch (e) {
        document.getElementById("assistantResponse").innerHTML = "❌ Error: " + e.message;
      }
    }

    // Attach event to Send button
    document.getElementById("sendBtn").addEventListener("click", sendAssistantCommand);
  </script>
</body>
</html>
