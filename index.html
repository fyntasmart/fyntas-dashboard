<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FYNTAS AI Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #1a1a2e; color: white; font-family: sans-serif; padding: 30px; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; }
    .response-box { background: #16213e; padding: 15px; margin-top: 15px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🤖 FYNTAS AI Command Center</h1>
  
  <!-- ⚡ पक्का बटन जो हमेशा काम करेगा -->
  <button onclick="alert('✅ JavaScript is working perfectly!')">🧪 Test JavaScript</button>

  <br><br>
  <input type="text" id="commandInput" placeholder="Type command..." style="width:300px; padding:8px;">
  <button id="sendBtn">Send to AI</button>
  <div class="response-box" id="response">Your result will appear here...</div>

  <script>
    // असली Supabase क्रेडेंशियल (सुरक्षित)
    const SUPABASE_URL = "https://uipkgqqfahtdaevxwfef.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpcGtncXFmYWh0ZGFldnh3ZmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTAxNjIsImV4cCI6MjEwMTQyNjE2Mn0.i-4rx4fHHdruL8DCiwI2G2Duqfv0QO31xowPLsr4V8Y";
    const ASSISTANT_URL = "https://uipkgqqfahtdaevxwfef.supabase.co/functions/v1/assistant-agent";

    // Send फंक्शन
    async function sendToAI() {
      const cmd = document.getElementById("commandInput").value.trim();
      if (!cmd) return;
      document.getElementById("response").innerText = "🧠 Processing...";
      try {
        const res = await fetch(ASSISTANT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        document.getElementById("response").innerText = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById("response").innerText = "❌ Error: " + e.message;
      }
    }

    // बटन को जोड़ें
    document.getElementById("sendBtn").addEventListener("click", sendToAI);
  </script>
</body>
</html>
